<style>
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
  #stage { position:absolute; inset:0; overflow:hidden; background:#000; }
  #cam { position:absolute; inset:0; transform-origin:50% 50%; }
  #hall { position:absolute; left:-4%; top:-4%; width:108%; height:108%; object-fit:cover; opacity:0; }
  canvas { position:absolute; left:0; top:0; }
  #fx, #glow, #grain { width:1920px; height:1080px; }
  #glow { filter:blur(7px) brightness(1.7); mix-blend-mode:screen; }
  #panels { position:absolute; inset:0; perspective:1600px; perspective-origin:50% 50%; }
  .row { position:absolute; left:50%; top:50%; transform-style:preserve-3d; }
  .card { position:absolute; border-radius:16px; overflow:hidden; background:#000;
          box-shadow:0 0 70px rgba(60,140,255,.45), 0 0 0 1px rgba(150,200,255,.45); }
  .card img { width:100%; height:100%; display:block; object-fit:cover; object-position:50% 0; }

              -webkit-mask-image:radial-gradient(circle, #000 50%, transparent 70%); mask-image:radial-gradient(circle, #000 50%, transparent 70%); }
  .portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .badges { position:absolute; left:0; right:0; display:flex; justify-content:center; gap:26px; }

  .term .bar { height:54px; display:flex; align-items:center; gap:12px; padding:0 22px; border-bottom:1px solid rgba(150,200,255,.18); }
  .term .dot { width:14px; height:14px; border-radius:50%; background:#2b3b57; }
  .term .bar span { margin-left:14px; font:400 22px 'JetBrains Mono'; color:#8fb4e6; }
  .term .body { padding:30px 44px; font:400 30px/1.75 'JetBrains Mono'; color:#d6e4f7; white-space:pre; }
  .term .ok { color:#5ee08f; } .term .dim { color:#86a3c7; } .term .cur { display:inline-block; width:16px; height:30px; background:#8fb4e6; vertical-align:-5px; }

<script>
const W = 1920, H = 1080, TOTAL = 48.808;
const TAU = Math.PI * 2;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261018);
const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += R(); return (u - 2) / 0.577; };
const frac = x => x - Math.floor(x);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);

// สีอนุภาค 4 ระดับ x ความทึบ 3 ระดับ
const COLS = [[205, 236, 255], [115, 185, 255], [62, 132, 255], [32, 84, 205]];
const ALS = [0.9, 0.55, 0.26];
const STYLE = []; for (const c of COLS) for (const a of ALS) STYLE.push(`rgba(${c[0]},${c[1]},${c[2]},${a})`);
function bucketize(arr) { const b = Array.from({ length: 12 }, () => []); for (const p of arr) b[p.c * 3 + p.a].push(p); return b; }

// ---------- อนุภาคคลื่น ----------
const WAVE = [];
for (let i = 0; i < 42000; i++) {
  const v = R() ** 2.2;
  const al = (1 - v) ** 1.5;
  WAVE.push({ u0: R(), v, ph: R() * TAU, sp: v < 0.05 && R() < 0.25,
    c: v < 0.06 ? 0 : v < 0.22 ? 1 : v < 0.5 ? 2 : 3, a: al > 0.6 ? 0 : al > 0.3 ? 1 : 2, s: (v < 0.1 ? 2.1 : 1.4) + R() * 0.6 });
}
const WAVE_B = bucketize(WAVE);
const WV = [
  { rot: 0, zoom: 1.0, cx: .5, cy: .34, mx: 1 },
  { rot: -0.14, zoom: 1.35, cx: .55, cy: .80, mx: -1 },
  { rot: 0.10, zoom: 2.1, cx: .62, cy: .42, mx: 1 },
  { rot: 0.22, zoom: 1.6, cx: .45, cy: .74, mx: -1 },
];
function drawWave(ctx, tau, k, variant, alpha) {
  const V = WV[variant];
  const z = V.zoom * (1 + 0.07 * k), cr = Math.cos(V.rot), sr = Math.sin(V.rot);
  ctx.globalCompositeOperation = 'lighter';
  for (let b = 0; b < 12; b++) {
    const arr = WAVE_B[b]; if (!arr.length) continue;
    ctx.globalAlpha = alpha; ctx.fillStyle = STYLE[b];
    for (const p of arr) {
      const u = frac(p.u0 + tau * 0.018 * (0.5 + p.v));
      let x = -0.15 + 1.3 * u;
      const yc = 0.30 + 0.30 * x + 0.10 * Math.sin(2.4 * x + 0.6);
      x += 0.010 * Math.sin(17 * u + 6 * p.v + tau * 1.1);
      let y = yc + p.v * 0.55 + 0.025 * Math.sin(8 * u - 4 * p.v + tau * 0.8) * (0.3 + p.v) + 0.006 * Math.sin(37 * u + tau * 2.3 + p.ph);
      if (p.sp) y -= 0.06 * frac(p.ph + tau * 0.28) ** 1.5;
      const X = (x - V.cx) * W * V.mx, Y = (y - V.cy) * H;
      const px = W / 2 + (X * cr - Y * sr) * z, py = H / 2 + (X * sr + Y * cr) * z;
      if (px < -4 || px > W + 4 || py < -4 || py > H + 4) continue;
      const s = p.s * Math.sqrt(z);
      ctx.fillRect(px, py, s, s);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---------- อนุภาควงแหวน ----------
const RING = [];
for (let i = 0; i < 26000; i++) {
  const g = gauss(), ag = Math.abs(g);
  RING.push({ t0: R() * TAU, g, w: R() < 0.12, ph: R(),
    c: ag < 0.4 ? 0 : ag < 1 ? 1 : ag < 1.8 ? 2 : 3, a: ag < 0.6 ? 0 : ag < 1.4 ? 1 : 2, s: 1.3 + R() * 0.9 });
}
const RING_B = bucketize(RING);
const RV = {
  edgeL: { cx: .03, cy: .5, r: .62 }, edgeR: { cx: .97, cy: .5, r: .62 },
  center: { cx: .5, cy: .5, r: .36 }, big: { cx: .5, cy: .5, r: .42 },
  hall: { cx: .5, cy: .45, r: .25, floor: true }, hallFar: { cx: .5, cy: .46, r: .2, floor: true },
};
function ringXY(p, tau, cx, cy, Rr) {
  const th = p.t0 + tau * 0.07 + (p.w ? 0.1 * tau : 0);
  let rr = 1 + 0.028 * p.g + 0.022 * Math.sin(5 * p.t0 + tau * 1.4) + 0.014 * Math.sin(13 * p.t0 - tau * 2.2);
  if (p.w) rr += 0.18 * frac(p.ph + tau * 0.22) ** 2 * (p.g > 0 ? 1 : -0.5);
  return [cx + Rr * rr * Math.cos(th), cy + Rr * rr * Math.sin(th)];
}
function drawRing(ctx, tau, k, variant, alpha) {
  const V = RV[variant];
  const cx = V.cx * W, cy = V.cy * H, Rr = V.r * H * (1 + 0.04 * k);
  ctx.globalCompositeOperation = 'lighter';
  // แถบเรืองจาง ๆ รอบวง
  ctx.globalAlpha = alpha;
  ctx.lineWidth = Rr * 0.14; ctx.strokeStyle = 'rgba(40,110,255,0.10)';
  ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, TAU); ctx.stroke();
  // เส้นใยสว่าง
  for (let f = 0; f < 3; f++) {
    ctx.beginPath();
    for (let i = 0; i <= 420; i++) {
      const a = i / 420 * TAU;
      const rr = 1 + 0.006 * (f - 1) + 0.02 * Math.sin(5 * a + tau * 1.4 + f) + 0.012 * Math.sin(13 * a - tau * 2.2 + f * 2);
      const x = cx + Rr * rr * Math.cos(a + tau * 0.07), y = cy + Rr * rr * Math.sin(a + tau * 0.07);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.lineWidth = 1.3; ctx.strokeStyle = 'rgba(175,220,255,0.38)'; ctx.stroke();
  }
  for (let b = 0; b < 12; b++) {
    const arr = RING_B[b]; if (!arr.length) continue;
    ctx.fillStyle = STYLE[b];
    for (const p of arr) {
      const [x, y] = ringXY(p, tau, cx, cy, Rr);
      if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
      ctx.fillRect(x, y, p.s, p.s);
    }
  }
  if (V.floor) {   // เงาสะท้อนบนพื้นเปียก
    const fy = cy + Rr * 1.08;
    ctx.globalAlpha = alpha * 0.22;
    for (let b = 0; b < 12; b++) {
      const arr = RING_B[b]; ctx.fillStyle = STYLE[b];
      for (let i = 0; i < arr.length; i += 2) {
        const [x, y] = ringXY(arr[i], tau, cx, cy, Rr);
        const ry = fy + (fy - y) * 0.30;
        if (ry > H) continue;
        ctx.fillRect(x, ry, 2.2, 1.2);
      }
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---------- ฝุ่นดาว ----------
const STARS = [];
for (let i = 0; i < 1800; i++) STARS.push({ x: R(), y: R(), z: 0.2 + R() * 0.8, tw: R() * TAU });
const BOKEH = []; for (let i = 0; i < 18; i++) BOKEH.push({ x: R(), y: R(), r: 30 + R() * 90, a: 0.04 + R() * 0.07 });
function drawStars(ctx, tau, alpha, seed) {
  const g = ctx.createRadialGradient(W * .5, H * .55, 0, W * .5, H * .55, W * .7);
  g.addColorStop(0, `rgba(7,21,48,${alpha})`); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const x = frac(b.x + seed * 0.37 + tau * 0.004) * W, y = frac(b.y + seed * 0.21) * H;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    rg.addColorStop(0, `rgba(80,140,255,${b.a * alpha})`); rg.addColorStop(1, 'rgba(80,140,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
  }
  for (const s of STARS) {
    const x = frac(s.x + seed * 0.13 + tau * 0.006 / s.z) * W, y = (s.y + 0.002 * Math.sin(tau * 0.5 + s.tw)) * H;
    const a = (0.15 + 0.55 * (1 - s.z)) * (0.6 + 0.4 * Math.sin(tau * 2 + s.tw)) * alpha;
    const sz = 0.7 + 1.7 * (1 - s.z);
    ctx.fillStyle = `rgba(190,220,255,${a.toFixed(3)})`; ctx.fillRect(x, y, sz, sz);
  }
  ctx.globalCompositeOperation = 'source-over';
}
function darkBg(ctx, x, y, a) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * x, H * y, 0, W * x, H * y, W * .65);
  g.addColorStop(0, `rgba(8,22,50,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- ช็อต (ตัดตรงเสียงตูมที่วัดจากเสียงต้นแบบ) ----------
// 18/10/2026 รุ่น 2: เนื้อหาโปรไฟล์บุคคล (ตัวอย่าง) แก้ข้อความทุกบรรทัดเป็นของคุณ และใช้เฉพาะข้อมูลที่ตรวจแล้ว
const SETS = {
  sys: { w: 520, h: 325, gap: 46, imgs: ['own-product-1', 'client-system-1', 'client-system-2', 'client-system-3',
    'client-system-4', 'own-product-2', 'own-product-3', 'own-product-4'].map(n => `img/${n}.jpg`) },
  ebook: { w: 300, h: 450, gap: 44, imgs: ['1', '2', '3', '4', '5', '6', '7', '8'].map(n => `img/book-${n}.jpg`) },
  clips: { w: 300, h: 533, gap: 50, imgs: ['1', '2', '3', '4', '5', '6'].map(n => `covers/clip-${n}.jpg`) },
};
const SHOTS = [
  { t: 0, k: 'logo' },
  { t: 2.06, k: 'wave', v: 0 },
  { t: 5.23, k: 'ring', v: 'edgeL' },
  { t: 8.44, k: 'hall', v: 'hall' },
  { t: 11.63, k: 'stars', seed: 0 },
  { t: 14.83, k: 'wave', v: 1 },
  { t: 18.02, k: 'carousel', set: 'sys', dir: 1 },
  { t: 19.64, k: 'tilt', img: 'img/mobile-product-1.jpg', w: 400, h: 711, side: 1 },
  { t: 21.24, k: 'stars', seed: 1 },
  { t: 22.86, k: 'certs', seed: 2 },
  { t: 24.40, k: 'portrait' },
  { t: 26.03, k: 'term' },
  { t: 27.63, k: 'carousel', set: 'ebook', dir: -1 },
  { t: 29.23, k: 'tilt', img: 'img/event-poster-1.jpg', w: 520, h: 650, side: -1 },
  { t: 30.03, k: 'stars', seed: 3 },
  { t: 30.84, k: 'ringPanel', img: 'img/cover-4.jpg', w: 400, h: 400 },
  { t: 32.44, k: 'wave', v: 2 },
  { t: 33.26, k: 'tilt', img: 'img/event-poster-2.jpg', w: 520, h: 650, side: 1 },
  { t: 34.03, k: 'ring', v: 'edgeR' },
  { t: 34.84, k: 'carousel', set: 'clips', dir: 1 },
  { t: 35.63, k: 'ring', v: 'center' },
  { t: 36.84, k: 'stars', seed: 4 },
  { t: 38.62, k: 'wave', v: 3 },
  { t: 40.62, k: 'hall', v: 'hallFar' },
  { t: 43.87, k: 'stars', seed: 5, dim: true },
  { t: 47.20, k: 'logo', end: true },
];
const TEXTS = [
  { a: 2.9, b: 5.15, l: [['en', 'Years of experience in your field']] },
  { a: 5.6, b: 8.35, l: [['thS', 'ชื่อ นามสกุล'], ['en', 'Your Job Title']] },
  { a: 12.0, b: 14.75, l: [['en', 'Previous role, Company']] },
  { a: 15.2, b: 17.95, l: [['en', 'Current role, Your Company']] },
  { a: 21.35, b: 22.80, l: [['en', 'What you build']] },
  { a: 22.95, b: 24.36, y: -130, l: [['en', 'N certifications']] },
  { a: 24.40, b: 26.00, y: 330, l: [['thL', 'ชื่อ นามสกุล']] },
  { a: 27.75, b: 29.18, y: 330, l: [['en', 'N published books']] },
  { a: 30.06, b: 30.82, l: [['en', 'Event Name Year']] },
  { a: 31.00, b: 32.40, y: 440, l: [['en', 'N releases']] },
  { a: 35.75, b: 36.80, l: [['en', 'Creator of'], ['thS', 'ชื่อช่องของคุณ']] },
  { a: 36.95, b: 38.56, l: [['en', 'Service one']] },
  { a: 38.72, b: 40.56, l: [['en', 'Service two']] },
  { a: 43.95, b: 47.15, l: [['thM', 'ชื่อ นามสกุล'], ['url', 'example.com'], ['url', 'shop.example.com'], ['url', 'profile.example.com/you']] },
];
const TERM = [['systems', 'web · mobile app · cloud'], ['service 2', 'short description'], ['service 3', 'short description'],
  ['service 4', 'short description'], ['service 5', 'short description']];
const HITS = [[0.42, .5], [1.08, .25], [1.74, .3], [2.06, .9], [5.23, .6], [8.44, .5], [11.63, .6], [14.83, .5], [18.02, .8],
  [24.40, .9], [26.03, .4], [27.63, .3], [29.23, .35], [30.84, 1], [32.44, .6], [33.26, .45], [34.03, .6], [34.84, .45],
  [35.63, .55], [36.84, .4], [38.62, .45], [40.62, .6], [43.87, .8]];

const fx = document.getElementById('fx').getContext('2d');
const gl = document.getElementById('glow').getContext('2d');
const gr = document.getElementById('grain').getContext('2d');
const $ = id => document.getElementById(id);
const NOISE = [];
{ const r2 = rng(99); for (let n = 0; n < 8; n++) { const im = gr.createImageData(640, 360);
  for (let i = 0; i < im.data.length; i += 4) { const v = r2() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } NOISE.push(im); } }

let curShot = -1, curText = -1;
function shotAt(t) { let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1].t <= t) i++; return i; }

function buildPanels(S) {
  const P = $('panels');
  if (S.k === 'carousel') {
    const C = SETS[S.set], n = C.imgs.length, sp = C.w + C.gap;
    P.innerHTML = '<div class="row" id="row">' + C.imgs.map((src, i) =>
      `<div class="card" style="width:${C.w}px;height:${C.h}px;left:${(i - (n - 1) / 2) * sp - C.w / 2}px;top:${-C.h / 2}px"><img src="${src}"></div>`).join('') + '</div>';
  } else if (S.k === 'tilt' || S.k === 'ringPanel') {
    const cy = S.k === 'ringPanel' ? H * 0.47 : H / 2;
    P.innerHTML = `<div class="card" id="one" style="width:${S.w}px;height:${S.h}px;left:${W / 2 - S.w / 2}px;top:${cy - S.h / 2}px"><img src="${S.img}"></div>`;
  } else if (S.k === 'portrait') {
    P.innerHTML = `<div class="portrait" id="one" style="width:760px;height:760px;left:${W / 2 - 380}px;top:${H * 0.47 - 380}px"><img src="img/portrait.png"></div>`;
  } else if (S.k === 'certs') {
    P.innerHTML = `<div class="badges" style="top:${H / 2 - 20}px">` + [1, 2, 3, 4, 5, 6, 7, 8].map(i => `<img id="b${i}" src="img/cert0${i}.png">`).join('') + '</div>';
  } else if (S.k === 'term') {
    P.innerHTML = '<div class="term" id="one"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>claude</span></div><div class="body">'
      + '<div id="tl0"><span class="dim">&gt;</span> yourname --services</div>'
      + TERM.map((l, i) => `<div id="tl${i + 1}" style="opacity:0">  <span class="ok">✓</span> ${l[0].padEnd(11)}<span class="dim">${l[1]}</span></div>`).join('')
      + '</div></div>';
  } else P.innerHTML = '';
}

function buildText(T) {
  $('txt').innerHTML = T ? T.l.map(([c, s]) => `<div class="${c}">${s}</div>`).join('') : '';
}

window.renderAt = function (t) {
  const si = shotAt(t), S = SHOTS[si], next = SHOTS[si + 1] ? SHOTS[si + 1].t : TOTAL;
  const tau = t - S.t, dur = next - S.t, k = clamp(tau / dur, 0, 1);
  if (si !== curShot) { buildPanels(S); curShot = si; }

  // ไฟแฟลชและจังหวะกระแทกกล้องตามเสียงตูม
  let fl = 0, pu = 0;
  for (const [ht, s] of HITS) if (t >= ht) { fl += s * 0.45 * Math.exp(-(t - ht) * 10); pu += s * 0.025 * Math.exp(-(t - ht) * 6); }
  $('flash').style.opacity = Math.min(0.6, fl).toFixed(3);
  $('cam').style.transform = `scale(${(1 + pu).toFixed(4)})`;

  // พื้นหลัง + อนุภาค
  const hall = $('hall');
  hall.style.opacity = 0;
  fx.clearRect(0, 0, W, H);
  if (S.k === 'wave') { darkBg(fx, .3, .3, 1); drawWave(fx, t, k, S.v, 1); }
  else if (S.k === 'ring') { darkBg(fx, S.v === 'edgeL' ? .1 : S.v === 'edgeR' ? .9 : .5, .5, 1); drawRing(fx, t, k, S.v, 1); }
  else if (S.k === 'ringPanel') { darkBg(fx, .5, .5, 1); drawRing(fx, t, k, 'center', 0.9); }
  else if (S.k === 'portrait') { darkBg(fx, .5, .47, 1); drawRing(fx, t, k, 'big', 1); }
  else if (S.k === 'certs') drawStars(fx, t, 1, S.seed);
  else if (S.k === 'hall') {
    const fade = S.v === 'hallFar' ? 1 - 0.55 * k : 1;
    hall.style.opacity = (S.v === 'hallFar' ? 0.85 - 0.35 * k : 1).toFixed(3);
    hall.style.transform = `scale(${(S.v === 'hallFar' ? 1.08 - 0.06 * k : 1 + 0.05 * k).toFixed(4)})`;
    drawRing(fx, t, k, S.v, fade);
  }
  else if (S.k === 'stars') drawStars(fx, t, S.dim ? 0.55 : 1, S.seed);
  else if (S.k === 'carousel') { drawStars(fx, t, 0.8, { sys: 7, ebook: 8, clips: 9 }[S.set]); drawRing(fx, t, k, 'center', 0.18); }
  else if (S.k === 'tilt') { darkBg(fx, .5, .5, 1); drawWave(fx, t, k, S.side > 0 ? 1 : 3, 0.4); }
  else if (S.k === 'term') { darkBg(fx, .5, .5, 1); drawRing(fx, t, k, 'big', 0.35); }
  else { fx.fillStyle = '#000'; fx.fillRect(0, 0, W, H); }
  gl.clearRect(0, 0, 480, 270); gl.drawImage(fx.canvas, 0, 0, 480, 270);

  // แผงภาพปก / หน้าจอ
  if (S.k === 'carousel') $('row').style.transform = `translateZ(-260px) rotateY(${-26 * S.dir}deg) translateX(${(S.dir * (220 - 440 * k)).toFixed(1)}px)`;
  if (S.k === 'tilt') $('one').style.transform = `translateX(${S.side * 260}px) rotateY(${(S.side * (-24 + 9 * k)).toFixed(2)}deg) rotateX(4deg) scale(${(0.96 + 0.06 * k).toFixed(3)})`;
  if (S.k === 'ringPanel') $('one').style.transform = `rotateY(${(10 - 16 * k).toFixed(2)}deg) scale(${(0.94 + 0.08 * k).toFixed(3)})`;
  if (S.k === 'term') {
    $('one').style.transform = `rotateY(${(-14 + 6 * k).toFixed(2)}deg) rotateX(5deg) scale(${(0.95 + 0.05 * k).toFixed(3)})`;
    for (let i = 1; i <= TERM.length; i++) $('tl' + i).style.opacity = tau > 0.15 + (i - 1) * 0.22 ? 1 : 0;
  }
  if (S.k === 'portrait') $('one').style.transform = `scale(${(0.97 + 0.05 * k).toFixed(4)})`;
  if (S.k === 'certs') for (let i = 1; i <= 8; i++) {
    const o = clamp((tau - 0.05 * i) / 0.25, 0, 1);
    $('b' + i).style.opacity = o.toFixed(3); $('b' + i).style.transform = `translateY(${((1 - o) * 24).toFixed(1)}px)`;
  }

  // ตัวหนังสือ
  let ti = -1; for (let i = 0; i < TEXTS.length; i++) if (t >= TEXTS[i].a && t < TEXTS[i].b) ti = i;
  if (ti !== curText) { buildText(TEXTS[ti]); curText = ti; }
  if (ti >= 0) {
    const T = TEXTS[ti], d = t - T.a, rem = T.b - t, span = T.b - T.a;
    let o = Math.min(1, d / 0.35) * Math.min(1, rem / 0.3);
    if (d < 0.22) o *= 0.55 + 0.45 * Math.abs(Math.sin(d * 97));   // กะพริบตอนเข้า
    $('txt').style.opacity = clamp(o, 0, 1).toFixed(3);
    $('txt').style.transform = `translateY(${T.y || 0}px)`;
    const kk = d / span;
    for (const el of $('txt').querySelectorAll('.en')) {   // ขยายระยะตัวอักษรเฉพาะภาษาอังกฤษ
      const ls = (0.48 + 0.14 * kk).toFixed(3) + 'em';
      el.style.letterSpacing = ls; el.style.paddingLeft = ls;
    }
    const big = $('txt').querySelector('.thL,.thM');
    if (big) big.style.transform = `scale(${(1.05 - 0.05 * ease(Math.min(1, d / 1.2))).toFixed(4)})`;
  } else $('txt').style.opacity = 0;

  // โลโก้ต้นและท้าย
  const mk = $('mark');
  if (S.k === 'logo' && !S.end) {
    let o = clamp((t - 0.35) / 0.5, 0, 1) * 0.92;
    if (t > 0.35 && t < 2.0) o *= 0.55 + 0.45 * Math.abs(Math.sin(t * 41));
    mk.style.opacity = o.toFixed(3); mk.style.transform = `scale(${(0.96 + 0.04 * t / 2).toFixed(3)})`;
  } else if (S.k === 'logo') {
    mk.style.opacity = (clamp((t - S.t) / 0.5, 0, 1) * 0.9).toFixed(3); mk.style.transform = 'scale(1)';
  } else mk.style.opacity = 0;
  $('black').style.opacity = clamp((t - 48.1) / 0.6, 0, 1).toFixed(3);

  // เกรนฟิล์ม
  gr.putImageData(NOISE[Math.floor(t * 24) % 8], 0, 0);
};

window.ready = async function () {
  await document.fonts.ready;
  const srcs = [...new Set(Object.values(SETS).flatMap(c => c.imgs).concat(SHOTS.filter(s => s.img).map(s => s.img),
    ['img/portrait.png'], [1, 2, 3, 4, 5, 6, 7, 8].map(i => `img/cert0${i}.png`)))];
  const bad = [];
  await Promise.all(srcs.map(s => { const im = new Image(); im.src = s; return im.decode().catch(() => bad.push(s)); }));
  window.__bad = bad;
  await $('hall').decode().catch(() => null);
  for (const f of ['300 30px Montserrat', '300 40px Kanit', '400 30px "JetBrains Mono"']) await document.fonts.load(f, 'Aกข✓');
  return { fonts: [...document.fonts].filter(f => f.status === 'loaded').map(f => f.family + ' ' + f.weight).join(', '), hall: $('hall').naturalWidth, images: srcs.length, missing: bad };
};
</script>
