<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1080px; height:1130px; background:#14100d; overflow:hidden; font-family:'Prompt','Leelawadee UI',sans-serif; }
  .glow { position:absolute; left:120px; top:150px; width:840px; height:720px; border-radius:50%; filter:blur(110px); opacity:.32; background:#E08A6B; }
  .glow2 { position:absolute; left:520px; top:230px; width:420px; height:360px; border-radius:50%; filter:blur(90px); opacity:.28; background:#FFC83D; }
  svg { position:absolute; left:0; top:0; }
</style></head>
<body>
<div class="glow"></div><div class="glow2"></div>
<svg width="1080" height="1130" viewBox="0 -110 1080 1130">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2c22"/><stop offset="1" stop-color="#1c1510"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a8"/><stop offset=".5" stop-color="#e9edf2"/><stop offset="1" stop-color="#8a9098"/>
    </linearGradient>
  </defs>
  <!-- แฟลชไดรฟ์ เอียง -->
  <g transform="translate(330 610) rotate(-28)">
    <rect x="-70" y="-370" width="140" height="150" rx="10" fill="url(#metal)"/>
    <rect x="-38" y="-340" width="28" height="26" rx="4" fill="#3b3f46"/>
    <rect x="10" y="-340" width="28" height="26" rx="4" fill="#3b3f46"/>
    <rect x="-110" y="-230" width="220" height="430" rx="34" fill="url(#body)" stroke="#5a4231" stroke-width="6"/>
    <rect x="-110" y="-230" width="220" height="70" rx="20" fill="#FFC83D"/>
    <circle cx="0" cy="140" r="16" fill="#3DDC97"/>
    <rect x="-62" y="-110" width="124" height="124" rx="22" fill="none" stroke="#FFC83D" stroke-width="8"/>
    <path d="M-30 -80 V-16 M30 -80 V-16 M-30 -48 H30" stroke="#FFC83D" stroke-width="0"/>
    <g stroke="#FFC83D" stroke-width="8" stroke-linecap="round">
      <path d="M-40 -110 V-128 M0 -110 V-128 M40 -110 V-128 M-40 14 V32 M0 14 V32 M40 14 V32 M-62 -70 H-80 M-62 -30 H-80 M62 -70 H80 M62 -30 H80"/>
    </g>
  </g>
  <!-- ฟองแชตที่ออกมาจากแฟลชไดรฟ์ -->
  <g transform="translate(560 170)">
    <path d="M0 0 H380 Q420 0 420 40 V230 Q420 270 380 270 H120 L50 330 L64 270 H40 Q0 270 0 230 V40 Q0 0 40 0 Z" fill="#FFC83D"/>
    <text x="210" y="190" text-anchor="middle" font-family="Prompt, 'Leelawadee UI', sans-serif" font-weight="800" font-size="150" fill="#14100d">AI</text>
  </g>
  <g fill="#FFC83D">
    <circle cx="520" cy="520" r="14"/><circle cx="552" cy="480" r="10"/><circle cx="575" cy="448" r="7"/>
  </g>
  <!-- สัญลักษณ์ไม่มีเน็ต -->
  <g transform="translate(880 600)">
    <circle cx="0" cy="0" r="92" fill="#1c1510" stroke="#FF3B3B" stroke-width="10"/>
    <g fill="none" stroke="#e9edf2" stroke-width="12" stroke-linecap="round">
      <path d="M-52 -12 Q0 -58 52 -12"/><path d="M-30 12 Q0 -14 30 12"/>
    </g>
    <circle cx="0" cy="36" r="10" fill="#e9edf2"/>
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#FF3B3B" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
</body></html>
