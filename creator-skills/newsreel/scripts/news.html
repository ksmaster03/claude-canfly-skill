<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>newsreel</title>
<style>
  /* แม่แบบคลิปเล่าข่าว: พื้นมืด หน้าต่างภาพซูมช้า ป้ายแฟ้ม ตราประทับ ซับทีละวลี  ห้ามใส่ letter-spacing กับข้อความไทย */
  :root { --y: #f5c518; --red: #d6262b; --ink: #0b0c0e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--ink); overflow: hidden; font-family: "Prompt", "Leelawadee UI", sans-serif; color: #fff; }
  #bg { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(46px) brightness(.28) saturate(.7); }
  #win { position: absolute; left: 0; top: 232px; width: 1080px; height: 1300px; overflow: hidden; background: #000; }
  #ph { position: absolute; inset: 0; background-size: cover; filter: saturate(.82) brightness(.84) contrast(1.06); transform-origin: 50% 45%; will-change: transform; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 62%, rgba(0,0,0,.58) 100%); }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%); pointer-events: none; }
  .br { position: absolute; width: 54px; height: 54px; border: 3px solid rgba(255,255,255,.5); }
  .br.tl { left: 44px; top: 44px; border-right: 0; border-bottom: 0; } .br.tr { right: 44px; top: 44px; border-left: 0; border-bottom: 0; }
  .br.bl { left: 44px; bottom: 44px; border-right: 0; border-top: 0; } .br.br2 { right: 44px; bottom: 44px; border-left: 0; border-top: 0; }
  #tag { position: absolute; left: 52px; top: 250px; font: 500 24px "Prompt"; color: var(--y); opacity: .85; }
  #brand { position: absolute; right: 52px; top: 262px; font: 700 30px "Prompt"; color: rgba(255,255,255,.82); text-align: right; }
  #credit { position: absolute; left: 20px; bottom: 14px; font: 400 20px "Prompt"; color: rgba(255,255,255,.62); max-width: 1040px; white-space: nowrap; overflow: hidden; }
  #chip { position: absolute; left: 52px; top: 720px; max-width: 900px; padding: 16px 30px 18px; background: rgba(8,8,8,.9); border: 3px solid var(--y); font: 700 56px/1.2 "Prompt"; clip-path: inset(0 100% 0 0); }
  #chip small { display: block; text-align: right; font: 600 18px "Prompt"; color: var(--y); margin-top: 2px; }
  #info { position: absolute; left: 0; right: 0; top: 880px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #info > span { background: rgba(8,8,8,.86); border-radius: 14px; padding: 6px 26px 8px; font: 700 50px/1.25 "Prompt"; }
  #sub { position: absolute; left: 40px; right: 40px; top: 1376px; text-align: center; font: 700 62px/1.25 "Prompt"; -webkit-text-stroke: 9px #000; paint-order: stroke fill; text-shadow: 0 5px 14px rgba(0,0,0,.75); white-space: nowrap; }
  #sub.em { font-size: 76px; color: var(--y); top: 1366px; }
  .n { color: var(--y); }
  #stamp { position: absolute; inset: 0; background: var(--ink); display: none; align-items: center; justify-content: center; }
  #stamp div { border: 7px solid var(--red); color: var(--red); padding: 22px 54px 26px; font: 800 118px/1.15 "Prompt"; transform: rotate(-6deg); text-align: center; max-width: 960px; }
  #cta { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 54px; background: rgba(6,7,9,.86); }
  #cta .row { display: flex; gap: 46px; }
  #cta .btn { width: 400px; padding: 44px 0 40px; border-radius: 34px; display: flex; flex-direction: column; align-items: center; gap: 22px; font: 700 62px "Prompt"; }
  #cta .like { background: #fff; color: #111; } #cta .follow { background: var(--y); color: #111; }
  #cta svg { width: 150px; height: 150px; }
  #cta .who { font: 600 46px "Prompt"; color: rgba(255,255,255,.9); } #cta .head { font: 800 84px "Prompt"; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="win"><div id="ph"></div><div id="shade"></div><div id="credit"></div></div>
<div id="vig"></div>
<div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br2"></div>
<div id="tag"></div><div id="brand"></div>
<div id="chip"></div><div id="info"></div>
<div id="stamp"><div></div></div>
<div id="cta">
  <div class="head"></div>
  <div class="row">
    <div class="btn like"><svg viewBox="0 0 24 24" fill="#111"><path d="M2 21h4V9H2v12zm20-11a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 1 6.6 7.6C6.2 8 6 8.5 6 9v10a2 2 0 0 0 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7c.1-.3.2-.5.2-.8v-2z"/></svg><span class="a"></span></div>
    <div class="btn follow"><svg viewBox="0 0 24 24" fill="#111"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg><span class="b"></span></div>
  </div>
  <div class="who"></div>
</div>
<div id="sub"></div>
<script>
// ตัวเรนเดอร์เรียก init(lines) ครั้งเดียว แล้ว renderAt(t) ทุกเฟรม ทุกอย่างคำนวณจาก t ล้วน ไม่มีสถานะค้าง
const $ = id => document.getElementById(id);
let L = [], fileNo = 0;
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const num = s => esc(s).replace(/\d[\d,.]*\s?%?/g, m => `<span class="n">${m}</span>`);
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
window.init = lines => {
  L = lines;
  let k = 0;
  L.forEach(l => { if (l.scene.chip) l._file = ++k; });
  const g = (L[0] || {}).scene || {};
  $('tag').textContent = g.tag || '';
  $('brand').textContent = g.brand || '';
  // โหลดภาพทั้งหมดไว้ก่อน กันเฟรมแรกของช็อตว่าง
  L.forEach(l => [].concat(l.scene.img || []).forEach(u => { const i = new Image(); i.src = u; }));
};
window.renderAt = t => {
  let li = L.findIndex(l => t >= l.start && t < l.end);
  if (li < 0) li = t < (L[0] ? L[0].start : 0) ? 0 : L.length - 1;
  const l = L[li], sc = l.scene, dur = Math.max(.1, l.end - l.start), u = Math.min(1, Math.max(0, (t - l.start) / dur));
  const isPhoto = sc.type === 'photo', isCta = sc.type === 'cta';
  $('stamp').style.display = sc.type === 'stamp' ? 'flex' : 'none';
  $('cta').style.display = isCta ? 'flex' : 'none';
  $('chip').style.display = isPhoto && sc.chip ? 'block' : 'none';
  $('info').style.display = isPhoto && sc.info ? 'flex' : 'none';
  if (isPhoto || isCta) {
    // หาภาพล่าสุดไว้เป็นพื้นของฉากปิดท้าย
    let src = sc, j = li;
    while (!src.img && j > 0) src = L[--j].scene;
    const imgs = [].concat(src.img || []), n = Math.max(1, imgs.length);
    const k = isPhoto ? Math.min(n - 1, Math.floor(u * n)) : n - 1;
    const v = isPhoto ? (u * n) % 1 : u, out = (li + k) % 2 === 1 || sc.zoom === 'out';
    const z = out ? 1.10 - .08 * v : 1.02 + .08 * v;
    const pos = [].concat(sc.pos || 'center')[Math.min(k, [].concat(sc.pos || 'center').length - 1)];
    if (imgs[k]) {
      $('ph').style.backgroundImage = $('bg').style.backgroundImage = `url("${imgs[k]}")`;
      $('ph').style.backgroundPosition = pos === 'top' ? '50% 12%' : pos === 'bottom' ? '50% 88%' : '50% 40%';
    }
    $('ph').style.transform = `scale(${z.toFixed(4)})`;
    $('credit').textContent = isPhoto ? ([].concat(sc.credit || '')[Math.min(k, [].concat(sc.credit || '').length - 1)] || '') : '';
  }
  if (isPhoto && sc.chip) {
    $('chip').innerHTML = `${num(sc.chip)}<small>FILE ${String(l._file).padStart(2, '0')}</small>`;
    $('chip').style.clipPath = `inset(0 ${(100 - 100 * ease((t - l.start - .15) / .3)).toFixed(1)}% 0 0)`;
  }
  if (isPhoto && sc.info) $('info').innerHTML = [].concat(sc.info).map(x => `<span>${num(x)}</span>`).join('');
  if (sc.type === 'stamp') {
    const s = 1.35 - .35 * ease((t - l.start) / .16);
    const el = $('stamp').firstElementChild;
    el.textContent = sc.text; el.style.transform = `rotate(-6deg) scale(${s.toFixed(3)})`;
  }
  if (isCta) {
    const c = $('cta');
    c.querySelector('.head').textContent = sc.head || 'ชอบคลิปนี้';
    c.querySelector('.a').textContent = sc.a || 'กดไลก์'; c.querySelector('.b').textContent = sc.b || 'กดติดตาม';
    c.querySelector('.who').textContent = sc.name || '';
    const p = t - l.start;
    c.querySelector('.like').style.transform = `scale(${(.7 + .3 * ease((p - .2) / .25)).toFixed(3)})`;
    c.querySelector('.follow').style.transform = `scale(${(.7 + .3 * ease((p - .55) / .25)).toFixed(3)})`;
    c.querySelector('.like').style.opacity = p > .2 ? 1 : 0; c.querySelector('.follow').style.opacity = p > .55 ? 1 : 0;
  }
  // ซับ: วลีล่าสุดที่เริ่มแล้ว ตัดฉับ ไม่เฟด  ฉากปิดท้ายไม่ขึ้นซับเพราะปุ่มบอกแล้ว
  let s = null;
  for (const x of l.subs || []) if (t >= x.t) s = x;
  const sub = $('sub');
  if (s && !isCta) { sub.innerHTML = num(s.text); sub.className = s.em ? 'em' : ''; sub.style.display = 'block'; sub.style.top = sc.type === 'stamp' ? '1290px' : ''; }
  else sub.style.display = 'none';
  // ย่อซับที่ล้นขอบให้พอดีบรรทัดเดียว
  sub.style.fontSize = '';
  if (sub.style.display !== 'none' && sub.scrollWidth > 1000) sub.style.fontSize = Math.floor(parseFloat(getComputedStyle(sub).fontSize) * 1000 / sub.scrollWidth) + 'px';
};
</script>
</body>
</html>
